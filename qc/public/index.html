<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PointSnap QC</title>
  <link rel="stylesheet" href="/style.css">
  <link rel="stylesheet" href="/workspace.css">
</head>
<body>
  <svg width="0" height="0" class="sprite" aria-hidden="true">
    <defs>
      <symbol id="i-logo" viewBox="0 0 56 56"><path d="M3.5 44.33h15.17M37.33 44.33H52.5" stroke="currentColor" stroke-opacity=".4" stroke-width="3.5" stroke-linecap="round"/><path d="M28 44.33 11.67 35V16.33L28 7l16.33 9.33V35zM44.33 16.33 28 25.67M28 25.67 11.67 16.33M28 25.67v18.66" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="28" cy="44.33" r="5.25" fill="#4C9AFF"/></symbol>
      <symbol id="i-car" viewBox="0 0 24 24"><path d="M3 14.5 5 9.4A2 2 0 0 1 6.9 8h10.2a2 2 0 0 1 1.9 1.4l2 5.1V18H3z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><circle cx="7.5" cy="18" r="1.7" fill="none" stroke="currentColor" stroke-width="1.6"/><circle cx="16.5" cy="18" r="1.7" fill="none" stroke="currentColor" stroke-width="1.6"/></symbol>
      <symbol id="i-truck" viewBox="0 0 24 24"><path d="M2.5 6.5h11v10h-11zM13.5 10h4l3 3.2v3.3h-7z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><circle cx="6.5" cy="17.5" r="1.7" fill="none" stroke="currentColor" stroke-width="1.6"/><circle cx="17" cy="17.5" r="1.7" fill="none" stroke="currentColor" stroke-width="1.6"/></symbol>
      <symbol id="i-bus" viewBox="0 0 24 24"><rect x="4" y="3.5" width="16" height="14" rx="2.5" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M4 11h16M8 17.5v2.5M16 17.5v2.5" fill="none" stroke="currentColor" stroke-width="1.6"/></symbol>
      <symbol id="i-ped" viewBox="0 0 24 24"><circle cx="12" cy="4.5" r="2" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M12 7.5v7M12 14.5l-3 6M12 14.5l3 6M7 11l5-2 5 2" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></symbol>
      <symbol id="i-bike" viewBox="0 0 24 24"><circle cx="6" cy="16" r="3.5" fill="none" stroke="currentColor" stroke-width="1.6"/><circle cx="18" cy="16" r="3.5" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M6 16l4-7h5l3 7M10 9 8.5 6.5H11" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/></symbol>
      <symbol id="i-barrier" viewBox="0 0 24 24"><rect x="2.5" y="7" width="19" height="6" rx="1" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M7 7l-4 6M13 7l-4 6M19 7l-4 6M5 13v6M19 13v6" fill="none" stroke="currentColor" stroke-width="1.6"/></symbol>
      <symbol id="i-cone" viewBox="0 0 24 24"><path d="M10 4h4l4 15H6zM8.2 11h7.6M4 19.5h16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/></symbol>
      <symbol id="i-box" viewBox="0 0 24 24"><path d="M12 3 20 7.5v9L12 21l-8-4.5v-9zM4 7.5 12 12l8-4.5M12 12v9" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></symbol>
      <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="m16 16 4.5 4.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
      <symbol id="i-play" viewBox="0 0 24 24"><path d="M8 5.5v13l10.5-6.5z" fill="currentColor"/></symbol>
      <symbol id="i-layers" viewBox="0 0 24 24"><path d="m12 4 8.5 4.5L12 13 3.5 8.5zM3.5 12.5 12 17l8.5-4.5M3.5 16.5 12 21l8.5-4.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></symbol>
    </defs>
  </svg>
  <div id="login" class="login" hidden></div>
  <div id="intro" class="intro" hidden></div>
  <header class="top" id="top" hidden>
    <div class="brand"><svg class="logo" aria-hidden="true"><use href="#i-logo"/></svg><div><b>PointSnap 3D</b><small>QC &amp; ANNOTATOR</small></div></div>
    <nav class="tabs" id="tabs" aria-label="Trang"></nav>
    <div class="top-right">
      <span id="status" class="conn">Đang kết nối CVAT…</span>
      <div class="acct">
        <button id="account" class="who" aria-haspopup="menu" aria-expanded="false"><span class="role" id="acct-role">QC</span><span id="acct-name"></span> ⌄</button>
        <div id="acct-menu" class="menu" role="menu" hidden><div class="menu-h" id="acct-user"></div><button role="menuitem" data-ext>Kết nối extension CVAT</button><button role="menuitem" data-act="logout">Đăng xuất</button></div>
      </div>
      <button id="theme" class="theme" aria-label="Đổi giao diện sáng / tối" title="Sáng / tối"><span class="track"></span><span class="stars"><i></i><i></i><i></i><i></i><i></i></span><span class="clouds"><i></i><i></i><i></i><i></i></span><span class="knob"><i></i><i></i><i></i></span></button>
    </div>
  </header>
  <div class="layout" id="layout" hidden>
    <aside class="side">
      <div class="side-h"><span>KHÔNG GIAN LÀM VIỆC</span><span id="job-count"></span></div>
      <label class="search"><svg aria-hidden="true"><use href="#i-search"/></svg><input id="job-filter" type="search" placeholder="Tìm job…" aria-label="Tìm job"><kbd>Ctrl K</kbd></label>
      <ul id="job-list" class="job-list"></ul>
      <div id="session" class="session"></div>
    </aside>
    <main id="main" class="main"><div class="empty">Chọn một job bên trái.</div></main>
  </div>
  <div id="modal" class="modal-bg" hidden></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="/vendor/guideline.js"></script>
  <script src="/app.js"></script>
  <script src="/spec.js"></script>
  <script src="/login.js"></script>
  <script src="/tickets.js"></script>
  <script src="/annotator.js"></script>
  <script src="/connect.js"></script>
</body>
</html>
