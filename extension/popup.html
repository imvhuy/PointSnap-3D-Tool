<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <title>PointSnap cho CVAT</title>
  <link rel="stylesheet" href="ui.css">
</head>
<body class="popup">
  <header class="app-head">
    <svg width="20" height="20" viewBox="0 0 48 48" fill="none" aria-hidden="true">
      <path d="M24 6 L38 14 L24 22 L10 14 Z M10 14 V30 L24 38 L38 30 V14 M24 22 V38" stroke="#fff" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round"/>
      <circle cx="24" cy="38" r="5" fill="#4C9AFF"/>
    </svg>
    <b>PointSnap</b>
    <span class="ver" id="version"></span>
  </header>
  <main>
    <div id="site" class="status" role="status">
      <span class="dot"></span>
      <div><span id="site-text">Đang xem trang này…</span><small id="site-sub"></small></div>
    </div>
    <button id="enable" class="btn primary block" type="button" hidden>Bật PointSnap cho trang này</button>
    <button id="enable-anyway" class="btn block" type="button" hidden>Vẫn bật cho trang này</button>
    <button id="reload" class="btn block" type="button" hidden>Tải lại trang</button>
    <ul id="checks" class="checks" hidden></ul>
    <section id="profile" class="profile" hidden>
      <p class="section-title">Trên trang này</p>
      <div class="row"><span>Bộ ngưỡng: <b id="guideline-name"></b></span><button id="change-guideline" class="link" type="button">Đổi</button></div>
      <label class="check"><input id="site-enabled" type="checkbox"><span>Hiện bảng annotator</span></label>
    </section>
    <p class="privacy">Mọi phép tính chạy trong trang CVAT; extension không gửi dữ liệu đi đâu.</p>
    <ul class="keys">
      <li><span class="k"><kbd>⌥⇧G</kbd></span><span>Hạ đáy box</span></li>
      <li><span class="k"><kbd>⌥⇧F</kbd></span><span>Khoá box</span></li>
      <li><span class="k"><kbd>⌥⇧D</kbd></span><span>Đánh dấu track xong</span></li>
    </ul>
    <div class="foot">
      <span id="site-origin"></span>
      <button id="open-options" type="button">Tùy chọn</button>
    </div>
  </main>
  <script src="hosts.js"></script>
  <script src="popup.js"></script>
</body>
</html>
