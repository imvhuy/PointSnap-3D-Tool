[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pointsnap"
version = "0.3.0"
description = "Phát hiện và cảnh báo sớm lỗi nhãn 3D cuboid trên CVAT"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pyyaml>=6.0",
    "requests>=2.31",
    "fastapi>=0.100",
    "pydantic>=2.0",
    "uvicorn>=0.20",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "httpx>=0.24"]
# Lớp 2 của Box Verifier (đối chiếu ảnh camera). Bản GPU: cài torch theo https://pytorch.org trước, rồi ".[vision]".
# transformers: model ảnh theo từ khóa (camera.model: gdino-sam2).
vision = ["torch>=2.2", "torchvision>=0.17", "pillow>=10", "transformers>=5.0"]
# Đọc PandaSet (file .pkl.gz là pickle của pandas): adapters/pandaset, scripts/eval_box_fit.py --dataset pandaset.
pandaset = ["pandas>=2.0"]

[project.scripts]
pointsnap = "pointsnap.cli.main:main"

[tool.setuptools.packages.find]
include = ["pointsnap*"]

[tool.setuptools.package-data]
pointsnap = ["config.yaml", "guidelines/*.yaml", "web/static/*", "web/static/fonts/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
