name: pointsnap

services:
  pointsnap_api:
    image: ${POINTSNAP_API_IMAGE:-pointsnap-api:0.1.0}
    build:
      context: .
      dockerfile: Dockerfile.api
      args:
        POINTSNAP_BASE_IMAGE: ${POINTSNAP_CLI_IMAGE:-pointsnap:0.1.0}
    init: true
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    environment:
      CVAT_URL: ${CVAT_BACKEND_URL:-http://cvat-server:8080}
      CVAT_WEB_URL: ${CVAT_WEB_URL:-http://localhost:8080}
      NUSCENES_ROOT: /work/data/nuscenes
    volumes:
      - ${POINTSNAP_EXPORT_HOST_ROOT:-./data/cvat}:/work/data/cvat:ro
      - type: bind
        source: ${NUSCENES_HOST_ROOT:-./data/nuscenes}
        target: /work/data/nuscenes
        read_only: true
    labels:
      traefik.enable: "true"
      traefik.http.services.pointsnap.loadbalancer.server.port: "8081"
      traefik.http.routers.pointsnap.rule: Host(`${CVAT_HOST:-localhost}`) && PathPrefix(`/pointsnap/`)
      traefik.http.routers.pointsnap.entrypoints: web
      traefik.http.routers.pointsnap.priority: "100"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8081/pointsnap/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - cvat

  pointsnap:
    image: ${POINTSNAP_CLI_IMAGE:-pointsnap:0.1.0}
    build: .
    init: true
    environment:
      CVAT_URL: ${CVAT_BACKEND_URL:-http://cvat-server:8080}
      CVAT_WEB_URL: ${CVAT_WEB_URL:-http://localhost:8080}
      CVAT_TOKEN: ${CVAT_TOKEN:-}
      NUSCENES_ROOT: /work/data/nuscenes
    volumes:
      - ./out:/work/out
      - ./data:/work/data
      - ${POINTSNAP_EXPORT_HOST_ROOT:-./data/cvat}:/work/data/cvat
      - type: bind
        source: ${NUSCENES_HOST_ROOT:-./data/nuscenes}
        target: /work/data/nuscenes
        read_only: true
    networks:
      - cvat

networks:
  cvat:
    external: true
    name: ${CVAT_DOCKER_NETWORK:-cvat_cvat}
